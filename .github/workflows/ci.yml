name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: TypeScript Check
      run: npx tsc --noEmit
      
    - name: Run Unit Tests
      run: npx vitest run
      
    - name: Verify Document Rendering Pipeline
      run: npx tsx scripts/verify-render.ts
